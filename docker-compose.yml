services:
  coco-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: coco-visualizer
    container_name: coco-visualizer
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Backs the BullMQ cleanup queue; the worker runs in-process (instrumentation.ts).
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Mount the local dataset you want to browse. The in-app file browser
      # defaults to the container user's home (/home/node for the `node` user),
      # so anything mounted under it shows up at the default location.
      # Override the host path with DATA_DIR, e.g. `DATA_DIR=~/Downloads/AX_MRG`.
      # Writable: saving/deleting and bulk cleanup rewrite the label files in place.
      - ${DATA_DIR:-./data}:/home/node/data
    restart: unless-stopped
    healthcheck:
      # node:22-slim has no curl/wget; use Node's built-in fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: coco-visualizer-redis
    # Exposed so `pnpm dev` on the host can use the same Redis
    # (REDIS_URL defaults to redis://localhost:6379).
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
